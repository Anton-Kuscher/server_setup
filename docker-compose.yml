networks:
  proxy-network:
    external: true

services:

  # Vaultwarden
  # Password manager
  vaultwarden:
    container_name: vaultwarden
    image: vaultwarden/server:latest
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN_NAME}"
      ROCKET_TLS: '{certs="/ssl/vaultwarden.crt",key="/ssl/vaultwarden.key"}'
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
    volumes:
      - ./docker_volumes/Vaultwarden:/data/
      - /etc/ssl/vaultwarden:/ssl:ro
    ports:
      - 8000:80


  # PiHole
  # Network wide Ad-Blocker
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Default HTTP Port
      - "8080:80/tcp"
      # Default HTTPs Port. FTL will generate a self-signed certificate
      - "444:443/tcp"
    environment:
      # Set the appropriate timezone for your location from
      # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones, e.g:
      TZ: 'Europe/Vienna'
      # Set a password to access the web interface. Not setting one will result in a random password being assigned
      FTLCONF_webserver_api_password: 'correct horse battery staple'
      # If using Docker's default `bridge` network setting the dns listening mode should be set to 'ALL'
      FTLCONF_dns_listeningMode: 'ALL'
      FTLCONF_webserver_api_app_sudo: "true"
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - './docker_volumes/PiHole:/etc/pihole'
    cap_add:
      # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE

  # Homarr
  # Dashboard for all services
  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Optional, only if you want docker integration
      - ./docker_volumes/Homarr:/appdata
    environment:
      - SECRET_ENCRYPTION_KEY=380cc35a31ff47f1ba20b57a04bba03529681aca2735593cb96e24fb5065b176
    ports:
      - '80:7575'

  # Upsnap
  # WoL Service
  upsnap:
    container_name: upsnap
    image: ghcr.io/seriousm4x/upsnap:5 # images are also available on docker hub: seriousm4x/upsnap:5
    restart: unless-stopped
    cap_add:
      - NET_RAW # NET_RAW is required for privileged ping
    cap_drop:
      - ALL
    network_mode: host # host is required for WOL magic packets
    volumes:
      - ./docker_volumes/UpSnap:/app/pb_data

  # Dash
  # Monitoring Service to integrate with Dashboard
  dash:
    container_name: dash
    image: mauricenino/dashdot:latest
    restart: unless-stopped
    privileged: true
    environment:
      DASHDOT_ENABLE_CPU_TEMPS: 'true'
    ports:
      - '3001:3001'
    volumes:
      - /:/mnt/host:ro

  nginx:
    container_name: nginx
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - '90:80'   # Public HTTP Port
      - '443:443' # Public HTTPS Port
      - '81:81'   # Admin Web Port
    environment:
      TZ: "Europe/Vienna"
      DISABLE_IPV6: 'true' # Uncomment if IPv6 is not enabled on host
    volumes:
      - ./docker_volumes/nginx/data:/data
      - ./docker_volumes/nginx/letsencrypt:/etc/letsencrypt